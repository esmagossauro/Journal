<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapinho</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Recipiente principal que simula a tela do celular -->
    <div class="app-container">

        <!-- =====================================================================
             ÁREA DE CONTEÚDO DAS ABAS
             ===================================================================== -->
        <main class="content-area">

            <!-- ==================== 1. ABA DO DIÁRIO (JOURNAL) ==================== -->
            <div class="tab-content active" id="tab-journal">

                <!-- Cabeçalho do mês e modo de visualização -->
                <div class="journal-header">
                    <div class="header-month">
                        <button type="button" class="month-btn" id="previous-month-btn">‹</button>
                        <span class="current-month"></span>
                        <button type="button" class="month-btn" id="next-month-btn">›</button>
                    </div>
                    <div class="header-change-mode">⫶☰</div>
                </div>

                <!-- Grade do calendário -->
                <div class="calendar-view"></div>

                <!-- Aviso de dia futuro -->
                <div id="future-day-toast" class="future-toast" style="display: none;">
                    Opa! Esse dia ainda não chegou.
                </div>

                <!-- Cartão inicial: Seleção rápida de humor -->
                <div class="daily-card">
                    <p>Como foi o seu dia?</p>
                    <div class="daily-card-humor">
                        <button type="button" data-humor="img/feliz.png">
                            <img src="img/feliz.png" alt="Feliz">
                        </button>
                        <button type="button" data-humor="img/bem.png">
                            <img src="img/bem.png" alt="Bem">
                        </button>
                        <button type="button" data-humor="img/neutro.png">
                            <img src="img/neutro.png" alt="Neutro">
                        </button>
                        <button type="button" data-humor="img/triste.png">
                            <img src="img/triste.png" alt="Triste">
                        </button>
                        <button type="button" data-humor="img/mal.png">
                            <img src="img/mal.png" alt="Mal">
                        </button>
                    </div>
                </div>

                <!-- Cartão de resumo (Aparece ao clicar em um dia já preenchido) -->
                <div class="entry-summary-card" id="entry-summary-card" style="display: none;">
                    <div class="summary-header">
                        <div class="summary-mood-and-date">
                            <img id="summary-mood-img" src="" alt="Humor" class="summary-mood-icon">
                            <div>
                                <div class="summary-date-main">
                                    <span id="summary-date-text">13 de nov.</span>
                                    <span class="favorite-star">✩</span>
                                </div>
                                <span id="summary-weekday-text" class="summary-weekday">sex. 2026</span>
                            </div>
                        </div>

                        <div class="summary-actions">
                            <button type="button" id="btn-edit-entry" title="Editar"><img src="https://img.icons8.com/puffy/32/create-new.png" alt="create-new"/></button>
                            <button type="button" id="btn-delete-entry" title="Excluir"><img src="https://img.icons8.com/puffy/32/delete.png" alt="delete"/></button>
                        </div>
                    </div>

                    <div class="summary-photo-wrapper" id="summary-photo-wrapper" style="display: none;">
                        <img id="summary-photo-img" src="" alt="Foto do dia" class="summary-photo-tilted">
                    </div>

                    <div class="summary-text-content" id="summary-text-content"></div>
                </div>

                <!-- Visão em lista (para uso futuro) -->
                <div class="list-view"></div>

                <!-- Modal deslizante de escrever / editar entrada -->
                <div class="overlay">
                    <div class="journal-entry">

                        <div class="journal-entry-header">
                            <span class="entry-header-date"></span>
                            <span class="entry-header-close">[ x ]</span>
                        </div>

                        <div class="journal-entry-content">

                            <!-- Cartão de humor -->
                            <div class="entry-card">
                                <p class="card-title">Como foi o seu dia?</p>
                                <div class="mood-options-row">
                                    <button type="button" humor-entry="img/feliz.png">
                                        <img src="img/feliz.png" alt="Feliz">
                                    </button>
                                    <button type="button" humor-entry="img/bem.png">
                                        <img src="img/bem.png" alt="Bem">
                                    </button>
                                    <button type="button" humor-entry="img/neutro.png">
                                        <img src="img/neutro.png" alt="Neutro">
                                    </button>
                                    <button type="button" humor-entry="img/triste.png">
                                        <img src="img/triste.png" alt="Triste">
                                    </button>
                                    <button type="button" humor-entry="img/mal.png">
                                        <img src="img/mal.png" alt="Mal">
                                    </button>
                                </div>
                            </div>

                            <!-- Cartão de texto -->
                            <div class="entry-card">
                                <span class="card-title">Nota de hoje</span>
                                <textarea id="journal-text" placeholder="Escreva aqui..."></textarea>
                            </div>

                            <!-- Cartão de fotos -->
                            <div class="entry-card">
                                <div class="photo-card-header">
                                    <span class="card-title">Foto de hoje</span>
                                    <button type="button" class="add-photo-icon-btn" id="btn-choose-photo">+</button>
                                </div>

                                <div class="photo-slot" id="photo-slot-modal">
                                    <img src="img/camera.svg" alt="Adicionar foto" class="slot-icon" id="modal-photo-preview">
                                </div>
                                <input type="file" id="photo-file-input" accept="image/*" style="display: none;">
                            </div>

                            <!-- Rodapé com botão Salvar -->
                            <div class="journal-entry-footer">
                                <button type="button" class="favorite-icon-btn">✩</button>
                                <button type="button" class="save-btn">Salvar</button>
                            </div>

                        </div>
                    </div>
                </div>

            </div>

            <!-- ==================== 2. ABA ACADEMIA ==================== -->
            <div class="tab-content" id="tab-gym">
                <h1>cadimia</h1>
            </div>

            <!-- ==================== 3. ABA SAPINHO (PET) ==================== -->
            <div class="tab-content" id="tab-pet">
                <div class="room-pet">

                    <!-- Cabeçalho do Pet: Nome e Moedas -->
                    <header>
                        <div class="header-title" onclick="togglePetMenu()">🐸 Sapinho ▾</div>
                        <div class="coins"><span>⭐ 0</span></div>
                    </header>

                    <!-- Menu flutuante do Pet -->
                    <div class="pet-menu" id="pet-menu">
                        <button type="button" onclick="openModal('modal-status')">Status</button>
                        <button type="button" onclick="openModal('modal-care')">Cuidar</button>
                        <button type="button" onclick="openModal('modal-hobbies')">Hobbies</button>
                        <button type="button" onclick="openModal('modal-loja')">Loja</button>
                    </div>

                    <!-- Avatar do Pet -->
                    <div class="pet-avatar">
                        <img src="img/bem.png" alt="Sapinho" onclick="togglePetMenu()">
                    </div>

                </div>
            </div>

            <!-- ==================== 4. ABA TAREFAS ==================== -->
            <div class="tab-content" id="tab-tasks">
                <h1>taskssss</h1>
            </div>

            <!-- ==================== 5. ABA PERFIL ==================== -->
            <div class="tab-content" id="tab-profile">
                <h1>perfill</h1>
            </div>

        </main>

        <!-- =====================================================================
             BARRA DE NAVEGAÇÃO INFERIOR
             ===================================================================== -->
        <footer>
            <nav class="bottom-nav">
                <button type="button" class="nav-btn active" onclick="switchTab('tab-journal', this)">📅</button>
                <button type="button" class="nav-btn" onclick="switchTab('tab-gym', this)">🏋️</button>
                <button type="button" class="nav-btn pet-btn" onclick="switchTab('tab-pet', this)">🐸</button>
                <button type="button" class="nav-btn" onclick="switchTab('tab-tasks', this)">📝</button>
                <button type="button" class="nav-btn" onclick="switchTab('tab-profile', this)">👤</button>
            </nav>
        </footer>

    </div>

    <script src="script.js"></script>
</body>

</html>
