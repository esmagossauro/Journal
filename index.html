<!DOCTYPE html>
<html lang="pt-Br">

    <head>
        <meta charset="UTF-8">   <!-- caracteres especiais aparecerem -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">   <!-- ser visto do tamanho do aparelho e na escala 1 -->
        <title>Sapinho</title>   <!-- titulo na aba -->
        <link rel="stylesheet" href="style.css">    <!-- liga ao css -->
    </head>


    <body>
        <div class="app-container"> <!-- recipiente que simula a tela do celular -->

            <main class="content-area"> <!-- CONTEUDO VAI AQUI -->
               
<!--================================================= JOURNAL ===================================================-->
                <div class="tab-content" id="tab-journal">
                    <div class="journal-header"> 
                        <div class="header-month">
                            <button class="month-btn" id="previous-month-btn">‹</button>
                            <span class="current-month"></span>
                            <button class="month-btn" id="next-month-btn">›</button>
                        </div>
                        <div class="header-change-mode">⫶☰</div>
                    </div>

                    <div class="calendar-view"></div>

                    <div class="daily-card">
                        <p>Como foi o seu dia?</p>
                        <div class="daily-card-humor">
                            <button data-humor="img/feliz.png">
                                <img src="img/feliz.png" alt="Feliz">
                            </button>
                             <button data-humor="img/bem.png">
                                <img src="img/bem.png" alt="Bem">
                            </button>
                            <button data-humor="img/neutro.png">
                                <img src="img/neutro.png" alt="Neutro">
                            </button>
                            <button data-humor="img/triste.png">
                                <img src="img/triste.png" alt="Triste">
                            </button>
                             <button data-humor="img/mal.png">
                                <img src="img/mal.png" alt="Mal">
                            </button>
                        </div>
                    </div>


                    <!-- Cartão de Resumo da Entrada (Aparece quando o dia tem registro) -->
                    <div class="entry-summary-card" id="entry-summary-card" style="display: none;">
                        <div class="summary-header">
                            <div class="summary-mood-and-date">
                                <img id="summary-mood-img" src="" alt="Humor" class="summary-mood-icon">
                                <div>
                                    <div class="summary-date-main">
                                        <span id="summary-date-text">13 de nov.</span> 
                                        <span class="favorite-star">✩</span>
                                    </div>
                                    <div id="summary-weekday-text" class="summary-weekday">sex. · 2026</div>
                                </div>
                            </div>
                            <div class="summary-actions">
                                <!-- Botão de Editar (Abre o modal de edição) -->
                                <button id="btn-edit-entry" title="Editar">✏️</button>
                                <!-- Botão de Excluir -->
                                <button id="btn-delete-entry" title="Excluir">🗑️</button>
                            </div>
                        </div>

                        <!-- Espaço para texto salvo -->
                        <div class="summary-text-content" id="summary-text-content">
                            <!-- O texto salvo aparece aqui -->
                        </div>
                    </div>





                    <div class="list-view"></div>

                    <div class="overlay">
                        <div class="journal-entry">

                            <div class="journal-entry-header">
                                <span class="entry-header-date"></span>
                                <span class="entry-header-close">✗</span>
                            </div>

                            <div class="journal-entry-content">
                                <div class="entry-card">
                                    <p class="card-title">Como foi o seu dia?</p>
                                    <div class="mood-options-row">
                                    <!-- Seus botões de rostinho vão aqui dentro -->
                                        <button humor-entry="img/feliz.png">
                                            <img src="img/feliz.png" alt="Feliz">
                                        </button>
                                        <button humor-entry="img/bem.png">
                                            <img src="img/bem.png" alt="Bem">
                                        </button>
                                        <button humor-entry="img/neutro.png">
                                            <img src="img/neutro.png" alt="Neutro">
                                        </button>
                                        <button humor-entry="img/triste.png">
                                            <img src="img/triste.png" alt="Triste">
                                        </button>
                                        <button humor-entry="img/mal.png">
                                            <img src="img/mal.png" alt="Mal">
                                        </button>
                                    </div>
                                </div>

                                <!-- 3. Cartão de Nota de Hoje (Área de texto) -->
                                <div class="entry-card">
                                    <span class="card-title">Nota de hoje</span>
                                    <textarea id="journal-text" placeholder="Escreva aqui..."></textarea>
                                </div>

                                <!-- 4. Cartão de Fotos -->
                                <div class="entry-card">
                                    <div class="photo-card-header">
                                        <span class="card-title">Foto de hoje</span>
                                        <button class="add-photo-icon-btn">+</button>
                                    </div>
                                    <div class="photo-slots-row">
                                        <div class="photo-slot">
                                            <img src="img/camera.svg" alt="Adicionar foto">
                                        </div>
                                        <div class="photo-slot">
                                            <img src="img/camera.svg" alt="Adicionar foto">
                                        </div>
                                        <div class="photo-slot">
                                            <img src="img/camera.svg" alt="Adicionar foto">
                                        </div>
                                    </div>
                                </div>

                                <!-- Rodapé fixo com o botão Concluir -->
                                <div class="journal-entry-footer">
                                    <button class="favorite-icon-btn">✩</button>
                                    <button class="save-btn">Salvar</button>
                                </div>

                            </div>

                        </div>
                    </div>


                </div>







                <div class="tab-content" id="tab-gym"><h1>cadimia</h1></div>
                
            <!--====================== SAPINHO =============================-->
              
                <div class="tab-content" id="tab-pet">
                    <div class="room-pet">

                        <!-- NOME E MOEDAS -->
                        <header> 
                            <div class="header-title" onclick="togglePetMenu()">🐸 Sapinho ▾</div>
                            <div class="coins"><span>⭐ 0</span></div>
                        </header>

                        <!-- OPÇÕES DO PET -->
                        <div class="pet-menu" id="pet-menu">
                            <button onclick="openModal('modal-status')">Status</button>
                            <button onclick="openModal('modal-care')">Cuidar</button>
                            <button onclick="openModal('modal-hobbies')">Hobbies</button>
                            <button onclick="openModal('modal-loja')">Loja</button>
                        </div>
                        
                        <!-- NOME E MOEDAS -->
                        <div class="pet-avatar">
                            <img src="img/bem.png" alt="" onclick="togglePetMenu()">
                        </div>

                    </div>
                </div>
                    
                
                
                
                <div class="tab-content" id="tab-tasks"><h1>taskssss</h1></div>
                <div class="tab-content" id="tab-profile"><h1>perfill</h1></div>
            </main>


            <footer>
                <nav class="bottom-nav">
                    <button class="nav-btn" onclick="switchTab('tab-journal', this)">📅</button>
                    <button class="nav-btn" onclick="switchTab('tab-gym', this)">🏋️</button>
                    <button class="nav-btn pet-btn" onclick="switchTab('tab-pet', this)">🐸</button>
                    <button class="nav-btn" onclick="switchTab('tab-tasks', this)">📝</button>
                    <button class="nav-btn" onclick="switchTab('tab-profile', this)">👤</button>
                </nav>
            </footer>
            
        </div>

        <script src="script.js"></script>
    </body>






</html>
